name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: https://cdm-career-recommendation-system.onrender.com/api
          VITE_GOOGLE_CLIENT_ID: 975768653453-5a0vde6rt2dmbsm8e1hr172rapeapep9.apps.googleusercontent.com

      - name: Install admin dependencies
        working-directory: admin
        run: npm ci

      - name: Build admin portal
        working-directory: admin
        run: npm run build
        env:
          VITE_API_URL: https://cdm-career-recommendation-system.onrender.com/api
          VITE_GOOGLE_CLIENT_ID: 975768653453-5a0vde6rt2dmbsm8e1hr172rapeapep9.apps.googleusercontent.com

      - name: Combine Pages artifacts
        run: |
          mkdir -p frontend/dist/admin
          cp -R admin/dist/. frontend/dist/admin/
          touch frontend/dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
